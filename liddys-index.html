<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trabelo — Liddy's Solicitors</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Arial', 'Helvetica Neue', sans-serif;
    background: #0a1628;
    color: #fff;
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 40px 20px; text-align: center;
  }
  .wordmark { font-family: 'Georgia', serif; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; color: #e74c3c; margin-bottom: 48px; opacity: 0.8; }
  .firm { font-family: 'Georgia', serif; font-size: clamp(1.5rem, 4vw, 2.2rem); font-weight: bold; color: #fff; letter-spacing: -0.02em; margin-bottom: 6px; }
  .location { font-size: 14px; color: rgba(255,255,255,0.38); letter-spacing: 0.06em; margin-bottom: 20px; }
  .tagline { font-size: 15px; color: rgba(255,255,255,0.52); line-height: 1.65; max-width: 420px; margin: 0 auto 40px; }
  .buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .btn-primary { background: #c0392b; color: #fff; font-size: 14px; font-weight: 700; padding: 13px 28px; border-radius: 4px; text-decoration: none; transition: background 0.2s; }
  .btn-primary:hover { background: #e74c3c; }
  .btn-outline { background: transparent; color: rgba(255,255,255,0.68); font-size: 14px; font-weight: 600; padding: 12px 26px; border: 1px solid rgba(255,255,255,0.18); border-radius: 4px; text-decoration: none; transition: border-color 0.2s, color 0.2s; }
  .btn-outline:hover { border-color: #e74c3c; color: #e74c3c; }
  .credit { position: fixed; bottom: 20px; font-size: 12px; color: rgba(255,255,255,0.16); letter-spacing: 0.04em; }
</style>
</head>
<body>
  <div class="wordmark">Trabelo</div>
  <div class="firm">Liddy's Solicitors</div>
  <div class="location">Wakefield &amp; Barnsley · Yorkshire</div>
  <p class="tagline">A free audit and demo site built specifically for Liddy's — showing what's holding the current site back, and what it could look like.</p>
  <div class="buttons">
    <a href="liddys-demo.html" class="btn-primary">View the new site →</a>
    <a href="liddys-audit.html" class="btn-outline">Read the audit</a>
  </div>
  <div class="credit">Prepared by Trabelo · Sheffield</div>
</body>
</html>
