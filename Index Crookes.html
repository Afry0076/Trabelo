<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trabelo — Crookes Club</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0d0d0d;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}
.card{background:#141414;border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:40px;max-width:480px;width:100%;text-align:center}
.logo{font-size:18px;font-weight:800;color:rgba(255,255,255,.3);margin-bottom:32px;letter-spacing:.05em}.logo span{color:#3b82f6}
.club{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#c0392b;margin-bottom:10px}
h1{font-size:26px;font-weight:800;letter-spacing:-.5px;margin-bottom:8px}
.sub{font-size:14px;color:rgba(255,255,255,.45);margin-bottom:32px;line-height:1.6}
.btns{display:flex;flex-direction:column;gap:12px}
.btn-demo{display:block;background:#c0392b;color:#fff;padding:14px 20px;border-radius:8px;font-size:15px;font-weight:700;text-decoration:none;transition:opacity .2s}
.btn-demo:hover{opacity:.88}
.btn-audit{display:block;background:rgba(255,255,255,.07);color:#fff;padding:14px 20px;border-radius:8px;font-size:15px;font-weight:700;text-decoration:none;border:1px solid rgba(255,255,255,.12);transition:background .2s}
.btn-audit:hover{background:rgba(255,255,255,.12)}
.footer{margin-top:28px;font-size:12px;color:rgba(255,255,255,.2)}
</style>
</head>
<body>
<div class="card">
  <div class="logo">Trabe<span>lo</span></div>
  <div class="club">Crookes Club · Sheffield S10</div>
  <h1>Website rebuild proposal</h1>
  <p class="sub">A free audit and demo site built specifically for Crookes Club — showing what's holding the current site back, and what it could look like.</p>
  <div class="btns">
    <a href="crookes-demo.html" class="btn-demo">View the new site →</a>
    <a href="crookes-audit.html" class="btn-audit">Read the audit</a>
  </div>
  <div class="footer">Prepared by Trabelo · trabelo-tau.vercel.app</div>
</div>
</body>
</html>
